<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16346F"/>
      <stop offset="1" stop-color="#0A1A3F"/>
    </linearGradient>
  </defs>

  <!-- Rounded square on the standard macOS icon grid (824 of 1024, 100 px margin) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <!-- Faint compass rose -->
  <path d="M512 300 L536 488 L724 512 L536 536 L512 724 L488 536 L300 512 L488 488 Z" fill="#FFFFFF" fill-opacity="0.16"/>

  <!-- Compass ring with a gap at the lower left, where the sparks fly out -->
  <path d="M258.3 604.3 A270 270 0 1 1 419.7 765.7" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>

  <!-- Needle, drawn upright and turned 45°: arrow to the north-east, broom to the south-west -->
  <g transform="rotate(45 512 512)" fill="#FFFFFF">
    <polygon points="512,280 554,512 470,512"/>
    <rect x="503" y="512" width="18" height="112" rx="6"/>
    <rect x="470" y="618" width="84" height="24" rx="8"/>
    <path d="M474 648 H550 L594 760 L578 746 L562 772 L546 748 L530 774 L512 750 L494 774 L478 748 L462 772 L446 746 L430 760 Z"/>
    <circle cx="512" cy="512" r="26" fill="#0F2756" stroke="#FFFFFF" stroke-width="12"/>
  </g>

  <!-- Teal sparks flying from the broom -->
  <g fill="#2DD4BF">
    <path d="M262 720 Q262 762 304 762 Q262 762 262 804 Q262 762 220 762 Q262 762 262 720 Z"/>
    <path d="M205 676 Q205 700 229 700 Q205 700 205 724 Q205 700 181 700 Q205 700 205 676 Z"/>
    <path d="M340 808 Q340 830 362 830 Q340 830 340 852 Q340 830 318 830 Q340 830 340 808 Z"/>
    <circle cx="218" cy="822" r="9"/>
  </g>
</svg>
